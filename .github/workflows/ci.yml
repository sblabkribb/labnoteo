name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (all workspaces)
        run: npm ci

      # Mandatory gates: a red result here fails the build.
      - name: Typecheck (core + plugin)
        run: npm run typecheck

      - name: Run tests (core + plugin)
        run: npm test

      # The root package.json version is the source of truth; catch a bump that
      # never reached the manifest or the READMEs before it reaches a release.
      - name: Check version sync
        run: npm run sync:versions -- --check

      - name: Build Obsidian plugin
        run: npm run build
