name: Release

on:
  push:
    tags:
      # Bare semver, no `v` prefix: Obsidian installs a plugin from the release
      # whose tag matches `manifest.json`'s `version` exactly, so `v1.2.3` would
      # leave the release undiscoverable.
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (all workspaces)
        run: npm ci

      - name: Typecheck (core + plugin)
        run: npm run typecheck

      - name: Run tests (core)
        run: npm test

      - name: Sync package versions
        run: npm run sync:versions

      - name: Build Obsidian plugin
        run: npm run build

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Verify tag matches manifest version
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$MANIFEST_VERSION" != "${{ steps.get_version.outputs.VERSION }}" ]; then
            echo "Tag ${{ steps.get_version.outputs.VERSION }} != manifest.json $MANIFEST_VERSION"
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            versions.json
            styles.css
          name: Labnote Assistant (Obsidian) v${{ steps.get_version.outputs.VERSION }}
          body: |
            ## 설치 방법

            **BRAT 사용 (권장, 자동 업데이트)**

            1. 커뮤니티 플러그인에서 **Obsidian42 - BRAT**를 설치합니다.
            2. *BRAT: Add a beta plugin for testing* 명령에 `sblabkribb/labnoteo`를 입력합니다.
            3. 설정 → 커뮤니티 플러그인에서 **Labnote Assistant**를 활성화합니다.

            **수동 설치**

            1. 아래 세 파일을 내려받습니다: `main.js`, `manifest.json`, `styles.css`
            2. 보관함(vault)의 `.obsidian/plugins/labnoteo/` 폴더를 만들고 세 파일을 복사합니다.
            3. 설정 → 커뮤니티 플러그인에서 **Labnote Assistant**를 활성화합니다.

            플러그인은 보관함 단위로 설치되므로 보관함마다 한 번씩 수행해야 합니다.
            `versions.json`은 Obsidian이 저장소에서 읽어 버전 호환성을 판단하는
            파일이며 보관함 안에서는 무시되므로 복사할 필요가 없습니다.
