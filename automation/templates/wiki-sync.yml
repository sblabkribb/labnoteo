# Wiki 동기화 (Phase 5) — labnoteo 자동화 설정 명령이 볼트에 설치합니다.
#
# 사람이 검토·승인한 wiki-staging/ 내용을 병합(예: main push) 후 GitHub Wiki
# 저장소(<repo>.wiki.git)로 동기화합니다. Wiki는 별도 git 저장소입니다.
#
# ⚠️ 알려진 리스크(인증): 기본 GITHUB_TOKEN은 Wiki 저장소 push 권한이 없는
#   구성이 많습니다. 그런 경우 아래 GH_WIKI_TOKEN 시크릿에 Wiki push 권한이 있는
#   PAT(또는 전용 토큰)을 설정하세요. (시크릿은 저장소 관리자가 직접 생성 —
#   자동화가 임의로 만들지 않습니다.) Wiki가 최초 1회 수동 초기화되어 있어야 합니다.
name: wiki-sync

on:
  push:
    branches: [main]
    paths:
      - 'wiki-staging/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync wiki-staging → GitHub Wiki
        env:
          # PAT with wiki push scope. Default GITHUB_TOKEN often cannot push the
          # wiki repo — set this secret if the push below fails with 403.
          GH_WIKI_TOKEN: ${{ secrets.GH_WIKI_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -d wiki-staging ]; then
            echo "wiki-staging/ 없음 — 스킵."; exit 0
          fi
          TOKEN="${GH_WIKI_TOKEN:-${GITHUB_TOKEN:-}}"
          if [ -z "$TOKEN" ]; then
            echo "::error::Wiki push 토큰이 없습니다 (GH_WIKI_TOKEN 시크릿 필요)."; exit 1
          fi
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-repo
          cp -a wiki-staging/. wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음 — 스킵."; exit 0
          fi
          git commit -m "docs(wiki): sync from wiki-staging (${GITHUB_SHA:0:7})"
          git push origin HEAD
