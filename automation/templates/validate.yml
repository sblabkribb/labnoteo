# 연구노트 검증 (Phase 3) — labnoteo 자동화 설정 명령이 볼트에 설치합니다.
#
# labnote/** 변경 push마다 결정적 검증(status/중복 id/@issue 마커/대용량 파일)을 수행합니다.
# 볼트에는 번들된 .labnoteo/scripts/validate.mjs만 있으면 되고 npm 설치가 필요 없습니다.
name: validate

on:
  push:
    paths:
      - 'labnote/**'
  # 검증은 언제나 볼트 전체를 훑으므로 수동 실행에 별도 인자가 필요 없습니다.
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate research notes
        run: node .labnoteo/scripts/validate.mjs
