# Experiment ↔ Issue 자동화 — labnoteo 자동화 설정 명령이 볼트에 설치합니다.
#
# 4a(결정적): discuss:true 또는 status:needs-review 실험만 GitHub-hosted 러너에서
#   결정적으로 Issue 생성/갱신(AI 없음). fetch + GITHUB_TOKEN(REST) 사용.
# 4b(AI 게이트): self-hosted 러너 + 로컬 LLM으로 자연 서술까지 감지(아래 두 번째 잡).
name: experiment-issues

on:
  push:
    paths:
      - 'labnote/**'

permissions:
  contents: read
  issues: write

jobs:
  # --- Phase 4a: deterministic promotion (no AI, GitHub-hosted) --------------
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the push range to diff changed files
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sync experiment issues (deterministic)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: node scripts/issue-sync.mjs

  # --- Phase 4b: AI context gate (self-hosted runner + local LLM) ------------
  # SECURITY: self-hosted runners must run on a PRIVATE repo only — a public repo
  # lets fork PRs execute runner code. This job is gated to push on `main`.
  # The local LLM endpoint/model come from repo variables; no API key is needed
  # for a local endpoint (notes never leave the lab network).
  ai-gate:
    if: github.ref == 'refs/heads/main'
    needs: deterministic
    runs-on: [self-hosted, labnoteo-llm]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: AI issue gate (local LLM)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          LLM_ENDPOINT: ${{ vars.LLM_ENDPOINT }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: node scripts/issue-gate.mjs
