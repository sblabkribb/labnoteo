id: insert-experiment-samples-table
order: 24
section: samples
title: { ko: 이 실험의 시료 목록 삽입, en: Insert sample list of this experiment }
seed: samples
steps:
  - caption: { ko: README의 Summary 아래에 커서를 둡니다, en: Put the cursor under Summary in the README }
    tool: open_file
    args: { path: { ko: labnote/001_GFP_발현/README.labnote.md, en: labnote/001_GFP_expression/README.labnote.md } }
  - tool: editor_move
    args: { text: '## Summary and Discussion', ch: end }
  - tool: ui_press
    args: { keys: Enter }
  - caption: { ko: 팔레트에서 이 실험의 시료 목록 삽입, en: Run Insert sample list of this experiment }
    palette: insert-experiment-samples-table
    hold: 1500
  - caption: { ko: 로컬 샘플과 쓰인 전역 샘플을 넣고 같은 ID는 로컬을 우선합니다, en: Local and used Global samples go in; Local wins for the same ID }
    highlight: { selector: .cm-table-widget }
    poster: true
    hold: 2000
  - caption: { ko: 한 번 더 실행하면 표를 겹쳐 넣지 않고 묻습니다, en: Run it again and it asks instead of adding a second table }
    palette: insert-experiment-samples-table
  - highlight: { selector: .labnote-pick-title }
    hold: 1200
  - caption: { ko: 기존 표를 최신으로 바꾸기를 고릅니다, en: Pick Replace the existing table(s) with the current samples }
    tool: modal_pick
    args: { text: $t(Replace the existing table(s) with the current samples), filter: '' }
  - caption: { ko: 표가 지금 시료로 바뀌었다고 알려 줍니다, en: A notice says the table now has the current samples }
    highlight: { selector: .notice }
    hold: 1500
