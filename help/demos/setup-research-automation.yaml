id: setup-research-automation
order: 2
section: start
title: { ko: 연구노트 자동화 설정, en: Setup research automation }
seed: basic
steps:
  - caption: { ko: 팔레트(Ctrl+P)에서 연구노트 자동화 설정을 실행합니다, en: Run Setup research automation from the palette (Ctrl+P) }
    palette: setup-research-automation
  - caption: { ko: 첨부 파일 위치를 묻습니다. ./images를 고릅니다, en: It asks where attachments go; choose ./images }
    tool: modal_button
    args: { text: $t(Use ./images) }
    hold: 1500
  - caption: { ko: 볼트 맨 위에 AGENTS.md와 QUICKSTART.md가 생깁니다, en: AGENTS.md and QUICKSTART.md appear at the vault root }
    highlight: { selector: .nav-file-title, text: AGENTS }
    poster: true
    hold: 1200
  - highlight: { selector: .nav-file-title, text: QUICKSTART }
    hold: 1200
  - caption: { ko: .github·.labnoteo 같은 점 폴더는 탐색기에 안 보입니다, en: Dot folders such as .github and .labnoteo are hidden in the explorer }
    hold: 2500
  - caption: { ko: 관리 표시가 손상된 설명서는 덮어쓰지 않습니다, en: A guide with broken managed marks is left unchanged }
    tool: eval
    args:
      expression: "(async () => { const f = app.vault.getFileByPath('QUICKSTART.md'); await app.vault.process(f, s => s.replace('<!-- END labnoteo (managed) -->', '')); return true; })()"
  - palette: open-user-guide
  - highlight: { selector: .notice }
    hold: 2000
